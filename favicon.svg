<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- horns -->
  <rect x="3" y="1" width="2" height="2" fill="#f4c542"/>
  <rect x="11" y="1" width="2" height="2" fill="#f4c542"/>
  <rect x="2" y="2" width="1" height="1" fill="#f4c542"/>
  <rect x="13" y="2" width="1" height="1" fill="#f4c542"/>
  <!-- head -->
  <rect x="3" y="3" width="10" height="9" fill="#3aa84a"/>
  <rect x="2" y="4" width="1" height="7" fill="#3aa84a"/>
  <rect x="13" y="4" width="1" height="7" fill="#3aa84a"/>
  <!-- brow shadow -->
  <rect x="3" y="5" width="10" height="1" fill="#2b7d37"/>
  <!-- eyes -->
  <rect x="5" y="6" width="2" height="2" fill="#fff"/>
  <rect x="9" y="6" width="2" height="2" fill="#fff"/>
  <!-- pupils -->
  <rect x="6" y="7" width="1" height="1" fill="#000"/>
  <rect x="10" y="7" width="1" height="1" fill="#000"/>
  <!-- mouth line -->
  <rect x="5" y="10" width="6" height="1" fill="#1f5a28"/>
  <!-- fang -->
  <rect x="7" y="10" width="2" height="2" fill="#fff"/>
</svg>
